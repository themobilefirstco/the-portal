name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    name: macOS ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Ensure Chrome is installed
        run: |
          if [ ! -d '/Applications/Google Chrome.app' ]; then
            brew install --cask google-chrome
          fi
      - name: Build pinned runtime and Keychain helper
        run: bash scripts/bootstrap.sh
      - name: Check source and documentation
        run: runtime/node scripts/check.mjs
      - name: Run full synthetic test suite
        run: runtime/node scripts/test.mjs
  secrets:
    name: Credential scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every available Git revision with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git . --redact=100 --log-opts=--all'
